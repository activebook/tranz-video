name: Release Extension

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'images/**'
      - 'goal/**'
      - '.github/workflows/jekyll-gh-pages.yml'
      - '.github/workflows/ci.yml'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Manifest JSON
        run: jq empty manifest.json

      - name: Static Type Checking
        run: npm run type-check

      - name: Determine Next Semantic Release Tag
        id: semver
        run: |
          git fetch --tags --force

          MANIFEST_VER=$(jq -r .version manifest.json)
          LATEST_TAG=$(git tag -l "v*" | sort -V | tail -n 1)

          echo "Manifest Version: $MANIFEST_VER"
          echo "Latest Git Tag: $LATEST_TAG"

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v${MANIFEST_VER}"
          else
            CLEAN_LATEST="${LATEST_TAG#v}"
            HIGHEST=$(printf "%s\n%s" "$CLEAN_LATEST" "$MANIFEST_VER" | sort -V | tail -n 1)

            if [ "$HIGHEST" = "$MANIFEST_VER" ] && [ "$MANIFEST_VER" != "$CLEAN_LATEST" ]; then
              NEW_TAG="v${MANIFEST_VER}"
            else
              IFS="." read -r MAJOR MINOR PATCH <<< "$CLEAN_LATEST"
              PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "Target Release Tag: $NEW_TAG"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Synchronize Manifest & Package Version with Target Release Tag
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          CLEAN_VER="${TAG#v}"
          echo "Synchronizing manifest.json and package.json version to: $CLEAN_VER"
          jq --arg v "$CLEAN_VER" '.version = $v' manifest.json > manifest.json.tmp && mv manifest.json.tmp manifest.json
          npm version "$CLEAN_VER" --no-git-tag-version

      - name: Build Production Distribution
        run: npm run build -- --prod

      - name: Build Extension Archive from dist/
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          ZIP_NAME="tranz-video-${TAG}.zip"
          cd dist && zip -r "../$ZIP_NAME" .
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release and Upload Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          gh release create "$TAG" "$ZIP_NAME" \
            --title "Tranz Video $TAG" \
            --generate-notes

      - name: Commit Manifest and Package Version Bump to Main
        run: |
          TAG="${{ steps.semver.outputs.tag }}"
          CLEAN_VER="${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): synchronize version to $CLEAN_VER [skip ci]"
            git push origin main
          fi
