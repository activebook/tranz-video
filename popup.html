<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tranz Video</title>
  <style>
    :root {
      --tzv-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --tzv-bg-popup: #0e121a;
      --tzv-bg-card: rgba(255, 255, 255, 0.04);
      --tzv-border: rgba(255, 255, 255, 0.12);
      --tzv-primary: #6366f1;
      --tzv-primary-hover: #4f46e5;
      --tzv-cyan: #38bdf8;
      --tzv-text-primary: #f8fafc;
      --tzv-text-secondary: #94a3b8;
      --tzv-text-muted: #64748b;
      --tzv-success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 290px;
      background: var(--tzv-bg-popup);
      color: var(--tzv-text-primary);
      font-family: var(--tzv-font);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      user-select: none;
    }

    /* Header */
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--tzv-border);
      padding-bottom: 12px;
    }

    .popup-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .popup-logo {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: block;
      object-fit: contain;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.35);
    }

    .popup-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .popup-version {
      font-size: 11px;
      color: var(--tzv-text-muted);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Master Enable Toggle Card */
    .toggle-card {
      background: var(--tzv-bg-card);
      border: 1px solid var(--tzv-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .toggle-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .toggle-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--tzv-text-primary);
    }

    .toggle-sub {
      font-size: 11px;
      color: var(--tzv-text-muted);
    }

    /* Modern Switch UI */
    .tzv-switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
    }

    .tzv-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .tzv-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.16);
      transition: 0.2s ease;
      border-radius: 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .tzv-slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: 0.2s ease;
      border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
    }

    input:checked + .tzv-slider {
      background: linear-gradient(135deg, var(--tzv-primary), var(--tzv-cyan));
      border-color: transparent;
    }

    input:checked + .tzv-slider:before {
      transform: translateX(16px);
    }

    /* Quick Target Language Selector */
    .form-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--tzv-text-secondary);
    }

    .select-dropdown {
      background: rgba(10, 14, 23, 0.9);
      border: 1px solid var(--tzv-border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--tzv-text-primary);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: border-color 0.15s ease;
    }

    .select-dropdown:focus {
      border-color: var(--tzv-primary);
    }

    /* Footer Navigation / Settings */
    .popup-footer {
      border-top: 1px solid var(--tzv-border);
      padding-top: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-settings {
      background: transparent;
      border: 1px solid var(--tzv-border);
      color: var(--tzv-text-secondary);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-settings:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--tzv-text-primary);
      border-color: rgba(255, 255, 255, 0.22);
    }
  </style>
</head>
<body>
  <header class="popup-header">
    <div class="popup-brand">
      <img src="icons/icon48.png" class="popup-logo" alt="Tranz Video">
      <span class="popup-title">Tranz Video</span>
    </div>
    <span class="popup-version">v1.0</span>
  </header>

  <!-- Master Enable / Disable Toggle -->
  <div class="toggle-card">
    <div class="toggle-info">
      <span class="toggle-title">Extension Enabled</span>
      <span class="toggle-sub" id="status-subtext">Active on web videos</span>
    </div>
    <label class="tzv-switch">
      <input type="checkbox" id="enable-toggle" checked>
      <span class="tzv-slider"></span>
    </label>
  </div>

  <!-- Quick Target Language Switcher -->
  <div class="form-row">
    <label class="form-label" for="target-lang-select">Target Language</label>
    <select class="select-dropdown" id="target-lang-select">
      <option value="en">English (en)</option>
      <option value="zh-Hans">Simplified Chinese (zh-Hans)</option>
      <option value="zh-Hant">Traditional Chinese (zh-Hant)</option>
      <option value="ja">Japanese (ja)</option>
      <option value="ko">Korean (ko)</option>
      <option value="es">Spanish (es)</option>
      <option value="fr">French (fr)</option>
    </select>
  </div>

  <!-- Footer / Open Settings -->
  <footer class="popup-footer">
    <button class="btn-settings" id="btn-open-options">
      <span>⚙️</span>
      <span>Settings & API Configuration</span>
    </button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
